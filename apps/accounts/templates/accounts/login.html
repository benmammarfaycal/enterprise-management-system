{% extends "base.html" %}



{% block title %}
Login | EMS
{% endblock %}





{% block content %}





<div class="row justify-content-center align-items-center"
     style="min-height:70vh;">





    <div class="col-md-5">





        <div class="card shadow-sm border-0">





            <div class="card-body p-5">





                <div class="text-center mb-4">





                    <div
                        class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-3"
                        style="width:70px;height:70px;font-size:28px;"
                    >

                        EMS

                    </div>





                    <h3 class="fw-bold">

                        Welcome Back

                    </h3>




                    <p class="text-muted">

                        Login to Enterprise Management System

                    </p>




                </div>








                <form method="POST">



                    {% csrf_token %}







                    <div class="mb-3">



                        <label class="form-label fw-semibold">

                            Email

                        </label>






                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >




                    </div>








                    <div class="mb-4">



                        <label class="form-label fw-semibold">

                            Password

                        </label>






                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >




                    </div>








                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        Login

                    </button>






                </form>







            </div>







        </div>







    </div>






</div>





{% endblock %}
