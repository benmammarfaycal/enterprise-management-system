{% extends "base.html" %}


{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h3 class="mb-4">
            Create Task
        </h3>


        <form method="post">

            {% csrf_token %}


            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create
            </button>


            <a
                href="{% url 'tasks:list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


        </form>


    </div>

</div>


{% endblock %}
