{% extends "base.html" %}


{% block content %}

<div class="card">

    <div class="card-body">

        <h3>
            Delete project
        </h3>


        <p>
            Are you sure you want to delete:
            <strong>{{ project.name }}</strong>?
        </p>


        <form method="post">

            {% csrf_token %}


            <button
                class="btn btn-danger"
                type="submit"
            >
                Delete
            </button>


            <a
                href="{% url 'projects:detail' project.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>


        </form>


    </div>

</div>

{% endblock %}
